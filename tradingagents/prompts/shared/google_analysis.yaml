# Google 工具调用后续分析提示词（共享）
version: "1.0"
name: "Google分析提示"

analysis_prompt: |
  现在请基于上述工具获取的数据，生成详细的{analyst_type}报告。

  **股票信息：**
  - 公司名称：{company_name}
  - 股票代码：{ticker}

  **分析要求：**
  1. 报告必须基于工具返回的真实数据进行分析
  2. 包含具体的数值和专业分析
  3. 提供明确的投资建议和风险提示
  4. 报告长度不少于800字
  5. 使用中文撰写
  6. 确保在分析中正确使用公司名称"{company_name}"和股票代码"{ticker}"

  {specific_requirements}

  请生成专业、详细的{analyst_type}报告。

retry_prompt_0: |
  基于以上工具调用的结果，请为{analyst_name}生成一份详细的分析报告。

  要求：
  1. 综合分析所有工具返回的数据
  2. 提供清晰的投资建议和风险评估
  3. 报告应该结构化且易于理解
  4. 包含具体的数据支撑和分析逻辑

  请生成完整的分析报告：

retry_prompt_1: |
  请简要分析{analyst_name}的工具调用结果并提供投资建议。
  要求：简洁明了，包含关键数据和建议。

retry_prompt_2: |
  请为{analyst_name}提供一个简短的分析总结。
